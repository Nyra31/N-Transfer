name: Release

# Al subir una etiqueta vX.Y.Z se compila el instalador y se publica en GitHub Releases.
# Las notas salen de release-notes/vX.Y.Z.md si existe.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # La release se crea antes de compilar: si la crea electron-builder al subir varios archivos
  # a la vez, a veces salen dos releases con la misma etiqueta.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La release $TAG ya existe"; exit 0; fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "N-Transfer ${TAG#v}" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "N-Transfer ${TAG#v}" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      matrix:
        # Para publicar también en Mac y Linux, añade: macos-latest, ubuntu-latest
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
