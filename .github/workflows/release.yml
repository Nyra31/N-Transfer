name: Release

# - Al subir una etiqueta vX.Y.Z: pruebas + instaladores de Windows, macOS y Linux publicados en GitHub Releases.
#   Las notas salen de release-notes/vX.Y.Z.md si existe.
# - A mano (Actions → Release → Run workflow): pruebas + instaladores como artefactos, SIN publicar nada.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # La release se crea antes de compilar: si la crea electron-builder desde tres sistemas a la vez,
  # salen releases duplicadas con la misma etiqueta.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La release $TAG ya existe"; exit 0; fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "N-Transfer ${TAG#v}" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "N-Transfer ${TAG#v}" --generate-notes
          fi

  build:
    needs: create-release
    # Si no hay etiqueta (ejecución manual), create-release se salta y aun así se compila
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # Sin certificados: macOS usa firma ad hoc (mac.identity "-"), Windows va sin firmar
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del núcleo
        run: npm test
      - name: Compilar y publicar
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar sin publicar
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never
      - name: Guardar instaladores (solo ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: n-transfer-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
