<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enviar al PC</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --ok:#28a745; --err:#d70015; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6; --accent:#0a84ff; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); padding:24px 16px env(safe-area-inset-bottom); }
  h1 { font-size:28px; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .btn { display:block; width:100%; padding:18px; border:0; border-radius:14px; font-size:18px; font-weight:600; background:var(--accent); color:#fff; margin-bottom:12px; text-align:center; }
  .btn.secondary { background:var(--card); color:var(--accent); }
  input[type=file] { display:none; }
  .list { margin-top:20px; }
  .item { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:15px; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .state { color:var(--muted); flex-shrink:0; }
  .state.ok { color:var(--ok); } .state.err { color:var(--err); }
  .bar { height:4px; background:rgba(127,127,127,.2); border-radius:2px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #summary { color:var(--muted); font-size:14px; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
  <h1>Enviar al PC</h1>
  <p class="sub">Elige lo que quieras pasar. Se guarda en el PC con la calidad original.</p>

  <label class="btn">📷 Fotos y vídeos
    <input id="media" type="file" accept="image/*,video/*" multiple>
  </label>
  <label class="btn secondary">📁 Archivos
    <input id="files" type="file" multiple>
  </label>

  <div id="summary"></div>
  <div class="list" id="list"></div>

<script>
const token = new URLSearchParams(location.search).get('t');
const list = document.getElementById('list');
const summary = document.getElementById('summary');
const queue = [];
let active = 0, done = 0, total = 0;
const PARALLEL = 2;

function fmt(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }

function addFiles(fileList) {
  for (const f of fileList) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = '<div class="row"><span class="name"></span><span class="state">En cola</span></div><div class="bar"><i></i></div>';
    el.querySelector('.name').textContent = f.name + ' · ' + fmt(f.size);
    list.prepend(el);
    queue.push({ f, el });
    total++;
  }
  pump();
}

function pump() {
  summary.textContent = total ? `${done} de ${total} enviados` : '';
  while (active < PARALLEL && queue.length) upload(queue.shift());
}

function upload({ f, el }) {
  active++;
  const state = el.querySelector('.state');
  const bar = el.querySelector('.bar i');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload?t=' + encodeURIComponent(token));
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + '%';
      state.textContent = p + '%';
    }
  };
  const finish = (ok, msg) => {
    state.textContent = msg;
    state.className = 'state ' + (ok ? 'ok' : 'err');
    bar.style.width = ok ? '100%' : bar.style.width;
    active--; if (ok) done++;
    pump();
  };
  xhr.onload = () => xhr.status === 200 ? finish(true, '✓ Listo') : finish(false, 'Error');
  xhr.onerror = () => finish(false, 'Sin conexión');
  const fd = new FormData();
  fd.append('file', f, f.name);
  xhr.send(fd);
}

for (const id of ['media', 'files']) {
  document.getElementById(id).addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
}
</script>
</body>
</html>
